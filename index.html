<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    /* 기본 리셋 및 컬러 변수 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    }

    :root {
      --bg-cream: #FFFDF0;
      --card-bg: #FFFFFF;
      --accent-yellow: #FFD84D;
      --accent-orange: #FF9E2C;
      --soft-yellow: #FFF6CF;
      --text-main: #332A15;
      --text-sub: #665A3D;
      --border-color: #F0E3B6;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 12px 28px rgba(230, 195, 80, 0.2);
      text-align: center;
    }

    /* 제목 영역 */
    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-sub);
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* MBTI 선택 그리드 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .mbti-btn {
      background-color: var(--soft-yellow);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 8px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    .mbti-btn:hover {
      background-color: var(--accent-yellow);
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(255, 158, 44, 0.25);
    }

    .mbti-btn:active {
      transform: translateY(0);
    }

    /* 결과 카드 영역 */
    #result-view {
      display: none;
      animation: popIn 0.35s ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .badge {
      display: inline-block;
      background-color: var(--soft-yellow);
      border: 2px solid var(--accent-yellow);
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 800;
      padding: 8px 18px;
      border-radius: 30px;
      margin-bottom: 16px;
    }

    .pokemon-emoji {
      font-size: 5rem;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .pokemon-name {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    /* 설명 상자 */
    .desc-box {
      background-color: var(--bg-cream);
      border: 2px dashed var(--border-color);
      border-radius: 20px;
      padding: 20px;
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-main);
      text-align: left;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .desc-box p {
      margin-bottom: 6px;
    }

    .desc-box p:last-child {
      margin-bottom: 0;
    }

    /* 궁합 상자 */
    .match-box {
      background: linear-gradient(135deg, #FFF7D6 0%, #FFE9B3 100%);
      border: 2px solid var(--accent-yellow);
      border-radius: 20px;
      padding: 16px 20px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .match-highlight {
      color: #D46900;
      font-weight: 800;
      font-size: 1.25rem;
    }

    /* 다시 고르기 버튼 */
    .retry-btn {
      width: 100%;
      background-color: var(--accent-yellow);
      border: 2px solid var(--accent-orange);
      color: var(--text-main);
      font-size: 1.3rem;
      font-weight: 800;
      padding: 16px 24px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(255, 158, 44, 0.3);
      transition: all 0.15s ease-in-out;
    }

    .retry-btn:hover {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      transform: translateY(-2px);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    /* 모바일 반응형 조절 */
    @media (max-width: 480px) {
      .container {
        padding: 24px 16px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .mbti-btn {
        padding: 14px 6px;
        font-size: 1.15rem;
      }
      .pokemon-name {
        font-size: 1.85rem;
      }
      .pokemon-emoji {
        font-size: 4.2rem;
      }
      .desc-box {
        font-size: 1.02rem;
        padding: 16px;
      }
    }
  </style>
</head>
